<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>幻想作家 · 首次设置</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f1ea;
        --card: #fffdf9;
        --ink: #2d1b0e;
        --muted: #6b5344;
        --line: #e6d5c3;
        --accent: #c45c26;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Source Han Sans SC", "Noto Sans SC", "PingFang SC", sans-serif;
        background: radial-gradient(circle at top, #fff7ee, var(--bg));
        color: var(--ink);
      }
      main {
        max-width: 560px;
        margin: 48px auto;
        padding: 32px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 20px;
        box-shadow: 0 16px 40px rgba(45, 27, 14, 0.08);
      }
      h1 { margin: 0 0 8px; font-size: 28px; }
      p.lead { margin: 0 0 24px; color: var(--muted); line-height: 1.6; }
      label { display: block; margin: 16px 0 6px; font-weight: 600; }
      input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        font-size: 15px;
      }
      .row { display: flex; gap: 8px; }
      .row input { flex: 1; }
      button {
        border: 0;
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 15px;
        cursor: pointer;
      }
      .secondary { background: #f0e4d6; color: var(--ink); }
      .primary { background: var(--accent); color: white; width: 100%; margin-top: 24px; font-weight: 600; }
      .note, .error { margin-top: 12px; font-size: 14px; line-height: 1.5; }
      .error { color: #9b1c1c; }
      .ok { color: #1f7a3a; }
    </style>
  </head>
  <body>
    <main>
      <h1>幻想作家</h1>
      <p class="lead">
        选一个本机项目根目录（默认「文档/幻想作家」），再填 OpenAI 兼容接口。
        保存后会出现在工作台「服务商管理」。密钥只写在该目录的 <code>.inkos/secrets.json</code>，不会进安装包，也不会写入 <code>~/.inkos/.env</code>。
      </p>
      <label>项目根目录</label>
      <div class="row">
        <input id="root" readonly />
        <button class="secondary" id="pick" type="button">选择…</button>
      </div>
      <label>服务名称</label>
      <input id="serviceName" placeholder="自定义" />
      <label>Base URL</label>
      <input id="baseUrl" placeholder="https://api.deepseek.com" />
      <label>API Key</label>
      <input id="apiKey" type="password" autocomplete="off" />
      <label>模型</label>
      <input id="model" placeholder="deepseek-v4-pro" />
      <div class="row" style="margin-top:16px">
        <button class="secondary" id="test" type="button">测试连接</button>
      </div>
      <button class="primary" id="save" type="button">保存并进入工作台</button>
      <p id="msg" class="note"></p>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      const api = window.fantaWriter;
      const msg = $("msg");

      function show(text, ok) {
        msg.textContent = text;
        msg.className = ok ? "note ok" : "note error";
      }

      async function boot() {
        const state = await api.getFirstRunState();
        $("root").value = state.projectRoot || "";
        $("serviceName").value = state.name || "自定义";
        $("baseUrl").value = state.baseUrl || "https://api.deepseek.com";
        $("model").value = state.model || "deepseek-v4-pro";
      }

      $("pick").onclick = async () => {
        const res = await api.pickProjectRoot();
        if (res.ok) $("root").value = res.path;
      };

      $("test").onclick = async () => {
        show("正在请求上游…", true);
        const res = await api.testModel({
          baseUrl: $("baseUrl").value,
          apiKey: $("apiKey").value,
          model: $("model").value,
        });
        show(res.message, res.ok);
      };

      $("save").onclick = async () => {
        show("正在写入项目根…", true);
        const res = await api.saveFirstRun({
          projectRoot: $("root").value,
          name: $("serviceName").value,
          baseUrl: $("baseUrl").value,
          apiKey: $("apiKey").value,
          model: $("model").value,
        });
        if (!res.ok) {
          show(res.message, false);
          return;
        }
        show("已保存，正在启动引擎…", true);
      };

      boot().catch((err) => show(String(err), false));
    </script>
  </body>
</html>
