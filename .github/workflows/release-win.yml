# 2.0-dev：完整 NSIS 安装包装配仍是 follow-up（蓝图 H3）。
# 打 tag 时先跑与 PR 相同的引擎测试，避免再打出 1.x Next standalone。
name: release-win

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release 标签；2.0-dev 阶段请用 v2.0.0-dev.N"
        required: false
        type: string

permissions:
  contents: write

jobs:
  test-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @actalk/inkos-core build
      - run: pnpm --filter @actalk/inkos-studio build
      - run: pnpm test
      - run: pnpm engine:smoke
      - name: Refuse to ship a 1.x Next installer
        run: |
          echo "P0 不产 NSIS 安装包。需要打包时先完成 pnpm workspace → electron-builder 装配。"
          if [ -d src/app ] || [ -f next.config.ts ]; then
            echo "仓库里仍有 Next 1.x 入口，拒绝发版"
            exit 1
          fi
